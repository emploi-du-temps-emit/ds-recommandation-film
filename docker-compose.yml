services:
  # === Base de données PostgreSQL ===
  db:
    image: postgres:15-alpine
    container_name: movie-recommender-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-movie_recommender}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === Backend FastAPI ===
  backend:
    build: ./backend
    container_name: movie-recommender-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-movie_recommender}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-docker}
    volumes:
      - ./models:/app/models
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # === Frontend Next.js ===
  frontend:
    build: ./frontend
    container_name: movie-recommender-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
