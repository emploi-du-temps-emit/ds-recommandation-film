<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/><stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="628" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="none"/><rect width="38" height="38" fill="none" stroke="rgba(234,179,8,0.03)" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="628" fill="url(#grid)"/>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="28" fill="#eab308" filter="url(#glow)">🏗️ Architecture du Projet</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial" font-size="14" fill="#6b7280">3 services independants orchestres avec Docker</text>

  <!-- Browser icon (left) -->
  <rect x="80" y="120" width="220" height="55" rx="8" fill="rgba(234,179,8,0.08)" stroke="rgba(234,179,8,0.2)" stroke-width="1.5"/>
  <rect x="85" y="125" width="20" height="20" rx="5" fill="rgba(234,179,8,0.2)"/>
  <circle cx="95" cy="135" r="5" fill="none" stroke="#eab308" stroke-width="1.5"/>
  <text x="115" y="140" font-family="Arial" font-size="13" fill="#d4d4d4">Navigateur Web</text>
  <text x="115" y="158" font-family="Arial" font-size="10" fill="#6b7280">Chrome / Firefox</text>

  <!-- Arrow browser → frontend -->
  <line x1="300" y1="147" x2="350" y2="147" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="350,142 360,147 350,152" fill="#eab308"/>

  <!-- Frontend box -->
  <rect x="360" y="105" width="200" height="85" rx="12" fill="rgba(234,179,8,0.1)" stroke="#eab308" stroke-width="2"/>
  <rect x="370" y="115" width="24" height="24" rx="6" fill="#eab308"/>
  <text x="382" y="132" text-anchor="middle" font-family="Arial" font-size="12" fill="#000" font-weight="bold">N</text>
  <text x="405" y="133" font-family="Arial" font-size="14" fill="#eab308" font-weight="bold">Frontend</text>
  <text x="380" y="152" font-family="Arial" font-size="11" fill="#a3a3a3">Next.js 16</text>
  <text x="380" y="168" font-family="Arial" font-size="11" fill="#a3a3a3">Tailwind CSS v4</text>
  <text x="380" y="182" font-family="Arial" font-size="10" fill="#6b7280">:3000</text>

  <!-- Arrow frontend → backend -->
  <line x1="560" y1="147" x2="610" y2="147" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="610,142 620,147 610,152" fill="#eab308"/>
  <text x="585" y="140" text-anchor="middle" font-family="Arial" font-size="9" fill="#6b7280">API calls</text>

  <!-- Backend box -->
  <rect x="620" y="105" width="200" height="85" rx="12" fill="rgba(234,179,8,0.1)" stroke="#eab308" stroke-width="2"/>
  <rect x="630" y="115" width="24" height="24" rx="6" fill="#eab308"/>
  <text x="642" y="132" text-anchor="middle" font-family="Arial" font-size="12" fill="#000" font-weight="bold">F</text>
  <text x="665" y="133" font-family="Arial" font-size="14" fill="#eab308" font-weight="bold">Backend</text>
  <text x="640" y="152" font-family="Arial" font-size="11" fill="#a3a3a3">FastAPI (Python)</text>
  <text x="640" y="168" font-family="Arial" font-size="11" fill="#a3a3a3">SQLAlchemy ORM</text>
  <text x="640" y="182" font-family="Arial" font-size="10" fill="#6b7280">:8000</text>

  <!-- Arrow backend → database -->
  <line x1="820" y1="147" x2="870" y2="147" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="870,142 880,147 870,152" fill="#eab308"/>

  <!-- Database icon -->
  <rect x="880" y="105" width="200" height="85" rx="12" fill="rgba(234,179,8,0.1)" stroke="#eab308" stroke-width="2"/>
  <!-- Cylinder shape -->
  <ellipse cx="910" cy="125" rx="18" ry="8" fill="none" stroke="#eab308" stroke-width="2"/>
  <line x1="892" y1="125" x2="892" y2="165" stroke="#eab308" stroke-width="2"/>
  <line x1="928" y1="125" x2="928" y2="165" stroke="#eab308" stroke-width="2"/>
  <ellipse cx="910" cy="165" rx="18" ry="8" fill="none" stroke="#eab308" stroke-width="2"/>
  <text x="940" y="133" font-family="Arial" font-size="14" fill="#eab308" font-weight="bold">Base de donnees</text>
  <text x="940" y="152" font-family="Arial" font-size="11" fill="#a3a3a3">PostgreSQL 15</text>
  <text x="940" y="168" font-family="Arial" font-size="11" fill="#a3a3a3">Donnees persistantes</text>
  <text x="940" y="182" font-family="Arial" font-size="10" fill="#6b7280">:5432</text>

  <!-- Docker container illustration -->
  <rect x="80" y="230" width="1040" height="160" rx="16" fill="rgba(234,179,8,0.03)" stroke="rgba(234,179,8,0.15)" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="80" y="230" width="200" height="35" rx="16" fill="rgba(234,179,8,0.1)"/>
  <text x="100" y="253" font-family="Arial" font-size="13" fill="#eab308" font-weight="bold">🐳 Docker Compose</text>

  <!-- 3 mini boxes inside Docker -->
  <rect x="120" y="285" width="180" height="80" rx="8" fill="rgba(234,179,8,0.08)" stroke="rgba(234,179,8,0.2)" stroke-width="1"/>
  <text x="210" y="310" text-anchor="middle" font-family="Arial" font-size="11" fill="#eab308" font-weight="bold">Frontend</text>
  <text x="210" y="328" text-anchor="middle" font-family="Arial" font-size="10" fill="#6b7280">Node 22 Alpine</text>
  <text x="210" y="345" text-anchor="middle" font-family="Arial" font-size="9" fill="#525252">Multi-stage build</text>

  <rect x="380" y="285" width="180" height="80" rx="8" fill="rgba(234,179,8,0.08)" stroke="rgba(234,179,8,0.2)" stroke-width="1"/>
  <text x="470" y="310" text-anchor="middle" font-family="Arial" font-size="11" fill="#eab308" font-weight="bold">Backend</text>
  <text x="470" y="328" text-anchor="middle" font-family="Arial" font-size="10" fill="#6b7280">Python 3.10</text>
  <text x="470" y="345" text-anchor="middle" font-family="Arial" font-size="9" fill="#525252">Hot-reload actif</text>

  <rect x="640" y="285" width="180" height="80" rx="8" fill="rgba(234,179,8,0.08)" stroke="rgba(234,179,8,0.2)" stroke-width="1"/>
  <text x="730" y="310" text-anchor="middle" font-family="Arial" font-size="11" fill="#eab308" font-weight="bold">PostgreSQL</text>
  <text x="730" y="328" text-anchor="middle" font-family="Arial" font-size="10" fill="#6b7280">Volume persistant</text>
  <text x="730" y="345" text-anchor="middle" font-family="Arial" font-size="9" fill="#525252">Healthcheck</text>

  <!-- Volume icon -->
  <rect x="870" y="295" width="60" height="60" rx="8" fill="rgba(234,179,8,0.06)" stroke="rgba(234,179,8,0.15)" stroke-width="1"/>
  <rect x="880" y="305" width="40" height="30" rx="3" fill="none" stroke="#eab308" stroke-width="1.5"/>
  <text x="900" y="342" text-anchor="middle" font-family="Arial" font-size="8" fill="#6b7280">data</text>

  <!-- Bottom key points -->
  <rect x="80" y="420" width="1040" height="90" rx="12" fill="rgba(234,179,8,0.03)" stroke="rgba(234,179,8,0.1)" stroke-width="1"/>
  <text x="100" y="448" font-family="Arial" font-size="14" fill="#eab308" font-weight="bold">💡 Points cles</text>
  
  <rect x="100" y="460" width="480" height="35" rx="6" fill="rgba(234,179,8,0.06)"/>
  <text x="115" y="482" font-family="Arial" font-size="12" fill="#a3a3a3">Separation des couches = maintenance + scalabilite</text>

  <rect x="600" y="460" width="500" height="35" rx="6" fill="rgba(234,179,8,0.06)"/>
  <text x="615" y="482" font-family="Arial" font-size="12" fill="#a3a3a3">Volumes bind-mount = hot-reload sans rebuild</text>

  <text x="600" y="610" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="14" fill="#525252">#Architecture #FullStack #Docker #WebDev</text>
</svg>