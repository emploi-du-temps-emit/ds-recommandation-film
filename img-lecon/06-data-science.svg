  <text x="737" y="325" text-anchor="middle" font-family="Arial" font-size="12" fill="#eab308" font-weight="bold">Modelisation</text>
  <text x="737" y="345" text-anchor="middle" font-family="Arial" font-size="10" fill="#6b7280">Pivot table</text>
  <text x="737" y="360" text-anchor="middle" font-family="Arial" font-size="10" fill="#6b7280">csr_matrix</text>
  <text x="737" y="375" text-anchor="middle" font-family="Arial" font-size="10" fill="#6b7280">Cosine similarity</text>
  <text x="737" y="390" text-anchor="middle" font-family="Arial" font-size="9" fill="#525252">Joblib .pkl</text>

  <text x="830" y="340" font-family="Arial" font-size="20" fill="#d97706">→</text>

  <rect x="860" y="270" width="155" height="140" rx="10" fill="rgba(234,179,8,0.1)" stroke="#eab308" stroke-width="2"/>
  <rect x="860" y="270" width="155" height="35" rx="10" fill="url(#yellow)"/>
  <text x="937" y="293" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">5️⃣</text>
  <text x="937" y="325" text-anchor="middle" font-family="Arial" font-size="12" fill="#eab308" font-weight="bold">Evaluation</text>
  <text x="937" y="345" text-anchor="middle" font-family="Arial" font-size="10" fill="#a3a3a3">Precision@K</text>
  <text x="937" y="360" text-anchor="middle" font-family="Arial" font-size="10" fill="#a3a3a3">MAE / RMSE</text>
  <text x="937" y="375" text-anchor="middle" font-family="Arial" font-size="10" fill="#a3a3a3">Tests utilisateur</text>
  <text x="937" y="390" text-anchor="middle" font-family="Arial" font-size="9" fill="#525252">Validation</text>

