  <text x="337" y="375" text-anchor="middle" font-family="Arial" font-size="10" fill="#6b7280">Encodage utf-8</text>
  <text x="337" y="390" text-anchor="middle" font-family="Arial" font-size="9" fill="#525252">~2% pertes</text>

  <text x="430" y="340" font-family="Arial" font-size="20" fill="#d97706">→</text>

  <rect x="460" y="270" width="155" height="140" rx="10" fill="rgba(234,179,8,0.06)" stroke="rgba(234,179,8,0.2)" stroke-width="1"/>
