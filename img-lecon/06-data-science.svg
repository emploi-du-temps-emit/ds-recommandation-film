  <text x="537" y="345" text-anchor="middle" font-family="Arial" font-size="10" fill="#6b7280">Statistiques</text>
  <text x="537" y="360" text-anchor="middle" font-family="Arial" font-size="10" fill="#6b7280">Distribution notes</text>
  <text x="537" y="375" text-anchor="middle" font-family="Arial" font-size="10" fill="#6b7280">Genres populaires</text>
  <text x="537" y="390" text-anchor="middle" font-family="Arial" font-size="9" fill="#525252">EDA complet</text>

  <text x="630" y="340" font-family="Arial" font-size="20" fill="#d97706">→</text>

  <rect x="660" y="270" width="155" height="140" rx="10" fill="rgba(234,179,8,0.06)" stroke="rgba(234,179,8,0.2)" stroke-width="1"/>
  <rect x="660" y="270" width="155" height="35" rx="10" fill="rgba(234,179,8,0.12)"/>
