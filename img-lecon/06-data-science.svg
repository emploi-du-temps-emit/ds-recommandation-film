      <stop offset="0%" stop-color="#0a0a0a"/><stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="628" fill="url(#bg)"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="none"/><rect width="38" height="38" fill="none" stroke="rgba(234,179,8,0.03)" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="628" fill="url(#grid)"/>

  <text x="600" y="55" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="28" fill="#eab308" filter="url(#glow)">📊 Data Science & Machine Learning</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial" font-size="14" fill="#6b7280">Pipeline complet : du dataset MovieLens au modele operationnel</text>

  <!-- Dataset Hero Stats -->
  <rect x="80" y="110" width="1040" height="100" rx="16" fill="rgba(234,179,8,0.04)" stroke="rgba(234,179,8,0.15)" stroke-width="1.5"/>
  
  <rect x="100" y="125" width="160" height="70" rx="10" fill="rgba(234,179,8,0.06)"/>
