<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/><stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="628" fill="url(#bg)"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="none"/><rect width="38" height="38" fill="none" stroke="rgba(234,179,8,0.03)" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="628" fill="url(#grid)"/>

  <text x="600" y="55" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="28" fill="#eab308" filter="url(#glow)">🌐 API REST avec FastAPI</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial" font-size="14" fill="#6b7280">6 endpoints pour gerer films, utilisateurs et recommandations</text>

  <!-- Server illustration -->
  <rect x="80" y="110" width="300" height="220" rx="12" fill="rgba(234,179,8,0.04)" stroke="rgba(234,179,8,0.15)" stroke-width="1.5"/>
  <rect x="230" y="80" width="100" height="35" rx="8" fill="url(#yellow)"/>
  <text x="280" y="103" text-anchor="middle" font-family="Arial" font-size="13" fill="#000" font-weight="bold">FastAPI</text>
  
  <!-- Lines of code -->
  <rect x="100" y="130" width="260" height="14" rx="3" fill="rgba(234,179,8,0.08)"/>
  <text x="108" y="141" font-family="monospace" font-size="9" fill="#a3a3a3">@app.get("/movies")</text>
  <rect x="100" y="150" width="260" height="14" rx="3" fill="rgba(234,179,8,0.05)"/>
  <text x="108" y="161" font-family="monospace" font-size="9" fill="#6b7280">@app.get("/movies/search")</text>
  <rect x="100" y="170" width="260" height="14" rx="3" fill="rgba(234,179,8,0.08)"/>
  <text x="108" y="181" font-family="monospace" font-size="9" fill="#a3a3a3">@app.get("/movies/{id}")</text>
  <rect x="100" y="190" width="260" height="14" rx="3" fill="rgba(234,179,8,0.05)"/>
  <text x="108" y="201" font-family="monospace" font-size="9" fill="#6b7280">@app.post("/ratings")</text>
  <rect x="100" y="210" width="260" height="14" rx="3" fill="rgba(234,179,8,0.08)"/>
  <text x="108" y="221" font-family="monospace" font-size="9" fill="#a3a3a3">@app.post("/users")</text>
  <rect x="100" y="230" width="260" height="14" rx="3" fill="rgba(234,179,8,0.05)"/>
  <text x="108" y="241" font-family="monospace" font-size="9" fill="#6b7280">@app.post("/login")</text>
  <rect x="100" y="250" width="260" height="14" rx="3" fill="rgba(234,179,8,0.08)"/>
  <text x="108" y="261" font-family="monospace" font-size="9" fill="#a3a3a3">@app.get("/recommendations")</text>
  <rect x="100" y="270" width="260" height="14" rx="3" fill="rgba(234,179,8,0.05)"/>
  <text x="108" y="281" font-family="monospace" font-size="9" fill="#6b7280">@app.get("/health")</text>

  <!-- Client illustration -->
  <rect x="440" y="110" width="300" height="220" rx="12" fill="rgba(234,179,8,0.04)" stroke="rgba(234,179,8,0.15)" stroke-width="1.5"/>
  <text x="590" y="140" text-anchor="middle" font-family="Arial" font-size="14" fill="#eab308" font-weight="bold">📱 Ce que le client voit</text>
  
  <rect x="460" y="155" width="260" height="40" rx="6" fill="rgba(234,179,8,0.05)"/>
  <rect x="465" y="158" width="40" height="15" rx="4" fill="#22c55e"/>
  <text x="470" y="170" font-family="Arial" font-size="9" fill="#000" font-weight="bold">GET</text>
  <text x="515" y="170" font-family="monospace" font-size="10" fill="#a3a3a3">/movies</text>
  <text x="515" y="186" font-family="Arial" font-size="9" fill="#6b7280">Liste paginee des films</text>

  <rect x="460" y="200" width="260" height="40" rx="6" fill="rgba(234,179,8,0.05)"/>
  <rect x="465" y="203" width="40" height="15" rx="4" fill="#eab308"/>
  <text x="470" y="215" font-family="Arial" font-size="9" fill="#000" font-weight="bold">POST</text>
  <text x="515" y="215" font-family="monospace" font-size="10" fill="#a3a3a3">/ratings</text>
  <text x="515" y="231" font-family="Arial" font-size="9" fill="#6b7280">Noter un film (1-5)</text>

  <rect x="460" y="245" width="260" height="40" rx="6" fill="rgba(234,179,8,0.05)"/>
  <rect x="465" y="248" width="40" height="15" rx="4" fill="#22c55e"/>
  <text x="470" y="260" font-family="Arial" font-size="9" fill="#000" font-weight="bold">GET</text>
  <text x="515" y="260" font-family="monospace" font-size="10" fill="#a3a3a3">/recommendations</text>
  <text x="515" y="276" font-family="Arial" font-size="9" fill="#6b7280">5 films suggeres par IA</text>

  <rect x="460" y="290" width="260" height="30" rx="6" fill="rgba(234,179,8,0.05)"/>
  <rect x="465" y="293" width="40" height="15" rx="4" fill="#ef4444"/>
  <text x="470" y="305" font-family="Arial" font-size="9" fill="#000" font-weight="bold">DEL</text>
  <text x="515" y="305" font-family="monospace" font-size="10" fill="#a3a3a3">/ratings</text>
  <text x="515" y="315" font-family="Arial" font-size="9" fill="#6b7280">Supprimer une note</text>

  <!-- Concepts section -->
  <rect x="800" y="110" width="320" height="220" rx="12" fill="rgba(234,179,8,0.04)" stroke="rgba(234,179,8,0.15)" stroke-width="1.5"/>
  <text x="960" y="140" text-anchor="middle" font-family="Arial" font-size="14" fill="#eab308" font-weight="bold">📚 Concepts decouverts</text>

  <rect x="820" y="155" width="280" height="35" rx="6" fill="rgba(234,179,8,0.06)"/>
  <text x="835" y="177" font-family="Arial" font-size="11" fill="#a3a3a3">✅ Pydantic : validation automatique</text>

  <rect x="820" y="195" width="280" height="35" rx="6" fill="rgba(234,179,8,0.06)"/>
  <text x="835" y="217" font-family="Arial" font-size="11" fill="#a3a3a3">🔐 JWT : authentification sans session</text>

  <rect x="820" y="235" width="280" height="35" rx="6" fill="rgba(234,179,8,0.06)"/>
  <text x="835" y="257" font-family="Arial" font-size="11" fill="#a3a3a3">🗃️ SQLAlchemy : ORM objet-relationnel</text>

  <rect x="820" y="275" width="280" height="35" rx="6" fill="rgba(234,179,8,0.06)"/>
  <text x="835" y="297" font-family="Arial" font-size="11" fill="#a3a3a3">🔗 Injection de dependances</text>

  <!-- Bottom challenges -->
  <rect x="80" y="360" width="1040" height="100" rx="12" fill="rgba(234,179,8,0.03)" stroke="rgba(234,179,8,0.1)" stroke-width="1"/>
  <text x="100" y="388" font-family="Arial" font-size="14" fill="#eab308" font-weight="bold">⚠️ Challenges surmontes</text>
  
  <rect x="100" y="400" width="490" height="40" rx="6" fill="rgba(234,179,8,0.05)"/>
  <text x="115" y="417" font-family="Arial" font-size="11" fill="#a3a3a3">🧩 Chemins de fichiers : local vs Docker</text>
  <text x="115" y="432" font-family="Arial" font-size="9" fill="#525252">/data/ml-latest-small/ → /app/data/</text>

  <rect x="610" y="400" width="490" height="40" rx="6" fill="rgba(234,179,8,0.05)"/>
  <text x="625" y="417" font-family="Arial" font-size="11" fill="#a3a3a3">📦 Compatibilite des versions</text>
  <text x="625" y="432" font-family="Arial" font-size="9" fill="#525252">psycopg2 → psycopg 3, passlib → bcrypt</text>

  <text x="600" y="610" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="14" fill="#525252">#FastAPI #RESTAPI #Python #Backend #SQLAlchemy</text>
</svg>