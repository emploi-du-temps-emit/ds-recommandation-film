<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" width="180" height="40">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Shield/Icon -->
  <rect x="4" y="4" width="32" height="32" rx="8" fill="url(#shieldBg)"/>
  <rect x="4" y="4" width="32" height="32" rx="8" fill="none" stroke="url(#shieldGlow)" stroke-width="1"/>
  <!-- MR text in shield -->
  <text x="20" y="26" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="16" fill="#000000" filter="url(#neonGlow)">MR</text>
  <!-- MovieReco text -->
  <text x="48" y="26" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="18" fill="url(#textGrad)" letter-spacing="0.5">MovieReco</text>
  <!-- Cyberpunk accent line under text -->
  <line x1="48" y1="32" x2="172" y2="32" stroke="url(#shieldGlow)" stroke-width="0.5" opacity="0.5"/>
</svg>
